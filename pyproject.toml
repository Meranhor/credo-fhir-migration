[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "credo-fhir-migration"
version = "0.1.0"
description = "Migrate FHIR R4 Patient and Observation resources into a simplified internal model."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "Django>=5.2,<5.3",
    "djangorestframework>=3.16",
    "httpx>=0.28",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-django>=4.11",
    "respx>=0.22",
    "ruff>=0.12",
    "mypy>=1.16",
    "django-stubs[compatible-mypy]>=5.2",
    "djangorestframework-stubs[compatible-mypy]>=3.16",
]

# This is an application, not a library: the install only pulls dependencies.
# Django code lives in backend/ and is put on the path by manage.py / pytest / mypy.
[tool.setuptools]
packages = []

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
pythonpath = ["backend"]
testpaths = ["backend"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["backend"]
extend-exclude = ["backend/*/migrations"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "DJ", "PT", "RUF"]
# Django declares Meta options (indexes, ordering...) as plain class attributes.
ignore = ["RUF012"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["backend"]
mypy_path = "backend"
explicit_package_bases = true
exclude = ["/migrations/"]
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]

[tool.django-stubs]
django_settings_module = "config.settings"
